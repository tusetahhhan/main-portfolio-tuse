<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Book - Page 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        
        #book-image {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            display: block;
        }
        
        #back-arrow {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: black;
            transition: background 0.3s;
            text-decoration: none;
            z-index: 100;
        }
        
        #back-arrow:hover {
            background: rgba(0, 0, 0, 0.2);
        }
        
        #hand-flip-back {
            position: absolute;
            bottom: 9px;
            left: 335px;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.3s;
            transform: scaleX(-1);
        }
        
        #hand-flip-back:hover {
            transform: scaleX(-1) scale(1.1);
        }
        
        #hand-flip-back img {
            width: 150px;
            height: auto;
        }
    </style>
</head>
<body>
    <a href="openbook.html" id="back-arrow">←</a>
    
    <img id="book-image" src="openbook.png" alt="Open Book Page 2">
    
    <a href="openbook.html" id="hand-flip-back">
        <img src="handflipping.png" alt="Flip Back">
    </a>
</body>
</html>
