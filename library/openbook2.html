<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Book - Page 2</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/neue-haas-grotesk-display-pro');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background-image: url('blurrybackground.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        
        #book-container {
            position: relative;
            max-width: 120vw;
            max-height: 120vh;
            transform: scale(1.3);
        }
        
        #book-image {
            max-width: 120vw;
            max-height: 120vh;
            object-fit: contain;
            display: block;
        }
        
        .clickable-area {
            position: absolute;
            cursor: pointer;
            transition: opacity 0.3s;
            max-width: 253.92px;
            max-height: 253.92px;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        
        .clickable-area:hover {
            opacity: 0.7;
        }
        
        #image-bunch {
            position: fixed;
            top: calc(50% - 1in);
            left: 57%;
            transform: translate(0, -50%) scale(1.3);
            cursor: pointer;
            z-index: 200;
            animation: bounce 1s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translate(0, -50%) scale(1.3) translateY(0);
            }
            50% {
                transform: translate(0, -50%) scale(1.3) translateY(-10px);
            }
        }
        
        #image-bunch.expanded {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: 90vw;
            height: 90vh;
            animation: none;
        }
        
        .bunch-container {
            position: relative;
            width: 200px;
            height: 200px;
        }
        
        #image-bunch.expanded .bunch-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            height: 100%;
            padding: 20px;
        }
        
        .bunch-image {
            position: absolute;
            width: 200px;
            height: auto;
            object-fit: contain;
            opacity: 0;
            transition: all 0.5s ease;
        }
        
        .bunch-image.visible {
            opacity: 1;
        }
        
        #image-bunch.expanded .bunch-image {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .bunch-image:nth-child(1) { top: 0; left: 0; z-index: 7; }
        .bunch-image:nth-child(2) { top: 10px; left: 10px; z-index: 6; }
        .bunch-image:nth-child(3) { top: 20px; left: 20px; z-index: 5; }
        .bunch-image:nth-child(4) { top: 30px; left: 30px; z-index: 4; }
        .bunch-image:nth-child(5) { top: 40px; left: 40px; z-index: 3; }
        .bunch-image:nth-child(6) { top: 50px; left: 50px; z-index: 2; }
        
        #image-bunch.expanded .bunch-image:nth-child(1),
        #image-bunch.expanded .bunch-image:nth-child(2),
        #image-bunch.expanded .bunch-image:nth-child(3),
        #image-bunch.expanded .bunch-image:nth-child(4),
        #image-bunch.expanded .bunch-image:nth-child(5),
        #image-bunch.expanded .bunch-image:nth-child(6) {
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        #click-text {
            position: fixed;
            top: calc(50% + 100px - 1.2in);
            left: 57%;
            transform: translate(0, 0) scale(1.3);
            font-family: 'Neue Haas Grotesk Display Pro', Arial, sans-serif;
            font-size: 10px;
            font-weight: 400;
            color: #333;
            pointer-events: none;
            z-index: 201;
            transition: opacity 0.3s ease;
        }
        
        #image-bunch.expanded + #click-text {
            opacity: 0;
        }
        
        #back-arrow {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: black;
            transition: background 0.3s;
            text-decoration: none;
            z-index: 100;
        }
        
        #back-arrow:hover {
            background: rgba(0, 0, 0, 0.2);
        }
        
        #hand-flip-back {
            position: absolute;
            bottom: -50px;
            left: 200px;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.3s;
            transform: scaleX(-1);
        }
        
        #hand-flip-back:hover {
            transform: scaleX(-1) scale(1.1);
        }
        
        #hand-flip-back img {
            width: 150px;
            height: auto;
        }
        
        #fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('blurrybackground.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        #fullscreen-overlay.active {
            display: flex;
        }
        
        #fullscreen-image {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
        }
        
        #close-fullscreen {
            position: absolute;
            top: 20px;
            left: 30px;
            color: black;
            font-size: 40px;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 1001;
        }
    </style>
</head>
<body>
    <a href="bookwall.html" id="back-arrow">←</a>
    
    <div id="book-container">
        <img id="book-image" src="openbook.png" alt="Open Book Page 2">
        
        <!-- Left side images -->
        <img class="clickable-area" src="new parti option2.jpg" style="top: 30%; left: 12%;" onclick="openFullscreen('new parti option2.jpg')">
        <img class="clickable-area" src="mm3.jpg" style="top: 55%; left: 12%;" onclick="openFullscreen('mm3.jpg')">
    </div>
    
    <!-- Right side bunched images -->
    <div id="image-bunch" onclick="toggleGrid()">
        <div class="bunch-container">
            <img class="bunch-image visible" src="telcel.jpg" alt="Image 1">
            <img class="bunch-image" src="waffle alternative ID (1).jpg" alt="Image 2">
            <img class="bunch-image" src="weld vs bolt.jpg" alt="Image 3">
            <img class="bunch-image" src="plan with bending moment.jpg" alt="Image 4">
            <img class="bunch-image" src="axon (1).jpg" alt="Image 5">
            <img class="bunch-image" src="connection details.jpg" alt="Image 6">
        </div>
    </div>
    <div id="click-text">CLICK</div>
    
    <a href="openbook.html" id="hand-flip-back">
        <img src="handflipping.png" alt="Flip Back">
    </a>
    
    <div id="fullscreen-overlay">
        <button id="close-fullscreen" onclick="closeFullscreen()">&times;</button>
        <img id="fullscreen-image" src="" alt="Fullscreen view">
    </div>
    
    <script>
        let isExpanded = false;
        
        function toggleGrid() {
            const bunch = document.getElementById('image-bunch');
            const images = document.querySelectorAll('.bunch-image');
            
            if (!isExpanded) {
                // Expand - shuffle out one by one
                bunch.classList.add('expanded');
                
                images.forEach((img, index) => {
                    setTimeout(() => {
                        img.classList.add('visible');
                    }, index * 100);
                });
                
                isExpanded = true;
            } else {
                // Collapse - reverse shuffle
                images.forEach((img, index) => {
                    setTimeout(() => {
                        if (index > 0) {
                            img.classList.remove('visible');
                        }
                    }, (images.length - 1 - index) * 100);
                });
                
                setTimeout(() => {
                    bunch.classList.remove('expanded');
                }, images.length * 100);
                
                isExpanded = false;
            }
        }
        
        function openFullscreen(imageSrc) {
            const overlay = document.getElementById('fullscreen-overlay');
            const image = document.getElementById('fullscreen-image');
            image.src = imageSrc;
            overlay.classList.add('active');
        }
        
        function closeFullscreen() {
            const overlay = document.getElementById('fullscreen-overlay');
            overlay.classList.remove('active');
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeFullscreen();
            }
        });
    </script>
</body>
</html>
