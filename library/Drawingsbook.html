<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawings Book - Page 1</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/neue-haas-grotesk-display-pro');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background-image: url('blurrybackground.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        
        #book-container {
            position: relative;
            max-width: 120vw;
            max-height: 120vh;
            transform: scale(1.3);
        }
        
        #book-image {
            max-width: 120vw;
            max-height: 120vh;
            object-fit: contain;
            display: block;
        }
        
        .clickable-area {
            position: absolute;
            cursor: grab;
            transition: opacity 0.3s;
            max-width: 253.92px;
            max-height: 253.92px;
            width: auto;
            height: auto;
            object-fit: contain;
            user-select: none;
        }
        
        .clickable-area:active {
            cursor: grabbing;
        }
        
        .clickable-area:hover {
            opacity: 0.7;
        }
        
        #back-arrow {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: black;
            transition: background 0.3s;
            text-decoration: none;
            z-index: 100;
        }
        
        #back-arrow:hover {
            background: rgba(0, 0, 0, 0.2);
        }
        
        #hand-flip-back {
            position: absolute;
            bottom: -50px;
            left: 200px;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.3s;
            transform: scaleX(-1);
        }
        
        #hand-flip-back:hover {
            transform: scaleX(-1) scale(1.1);
        }
        
        #hand-flip-back img {
            width: 150px;
            height: auto;
        }
        
        #hand-flip-forward {
            position: absolute;
            bottom: -50px;
            right: 200px;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.3s;
        }
        
        #hand-flip-forward:hover {
            transform: scale(1.1);
        }
        
        #hand-flip-forward img {
            width: 150px;
            height: auto;
        }
        
        #fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('blurrybackground.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        #fullscreen-overlay.active {
            display: flex;
        }
        
        #fullscreen-image {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
        }
        
        #close-fullscreen {
            position: absolute;
            top: 20px;
            left: 30px;
            color: black;
            font-size: 40px;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 1001;
        }
    </style>
</head>
<body>
    <a href="bookwall.html" id="back-arrow">←</a>
    
    <div id="book-container">
        <img id="book-image" src="openbook.png" alt="Drawings Book Page 1">
        
        <!-- Left side images -->
        <img class="clickable-area draggable" src="plan port.jpg" style="top: 28%; left: 14%;">
        <img class="clickable-area draggable" src="axon port.jpg" style="top: 56%; left: 14%;">
        
        <!-- Right side upper images -->
        <img class="clickable-area draggable" src="elevation.jpg" style="top: 36%; left: 58%;">
        <img class="clickable-area draggable" src="section cut.jpg" style="top: 28%; left: 58%;">
        
        <!-- Right side bottom image -->
        <img class="clickable-area draggable" src="tax.jpg" style="top: 50%; left: 58%;">
    </div>
    
    <a href="bookwall.html" id="hand-flip-back">
        <img src="handflipping.png" alt="Flip Back">
    </a>
    
    <a href="drawingsbook2.html" id="hand-flip-forward">
        <img src="handflipping.png" alt="Flip Forward">
    </a>
    
    <div id="fullscreen-overlay">
        <button id="close-fullscreen" onclick="closeFullscreen()">&times;</button>
        <img id="fullscreen-image" src="" alt="Fullscreen view">
    </div>
    
    <script>
        let isDragging = false;
        let draggedElement = null;
        let startX, startY, offsetX, offsetY;
        let clickStartTime;
        const CLICK_THRESHOLD = 200;
        
        document.querySelectorAll('.draggable').forEach(img => {
            img.addEventListener('mousedown', startDrag);
        });
        
        function startDrag(e) {
            clickStartTime = Date.now();
            draggedElement = e.target;
            
            const rect = draggedElement.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            
            startX = e.clientX;
            startY = e.clientY;
            
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
            
            e.preventDefault();
        }
        
        function drag(e) {
            if (!draggedElement) return;
            
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                isDragging = true;
                draggedElement.style.position = 'fixed';
                draggedElement.style.left = (e.clientX - offsetX) + 'px';
                draggedElement.style.top = (e.clientY - offsetY) + 'px';
                draggedElement.style.zIndex = '1000';
            }
        }
        
        function stopDrag(e) {
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDrag);
            
            const clickDuration = Date.now() - clickStartTime;
            
            if (!isDragging && clickDuration < CLICK_THRESHOLD) {
                openFullscreen(draggedElement.src);
            }
            
            isDragging = false;
            draggedElement = null;
        }
        
        function openFullscreen(imageSrc) {
            const overlay = document.getElementById('fullscreen-overlay');
            const image = document.getElementById('fullscreen-image');
            image.src = imageSrc;
            overlay.classList.add('active');
        }
        
        function closeFullscreen() {
            const overlay = document.getElementById('fullscreen-overlay');
            overlay.classList.remove('active');
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeFullscreen();
            }
        });
    </script>
</body>
</html>
